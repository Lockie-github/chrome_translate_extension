<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>划词大模型翻译设置</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <main class="shell">
      <header class="header">
        <h1>划词大模型翻译</h1>
        <p>配置你自己的 OpenAI Chat Completions 兼容接口。</p>
      </header>

      <form id="settings-form" class="form">
        <label class="field">
          <span>API URL</span>
          <input id="apiUrl" name="apiUrl" type="url" placeholder="https://api.example.com/v1/chat/completions" autocomplete="off">
        </label>

        <div class="grid">
          <label class="field">
            <span>API Key</span>
            <input id="apiKey" name="apiKey" type="password" placeholder="sk-..." autocomplete="off">
          </label>

          <label class="field">
            <span>模型名称</span>
            <input id="model" name="model" type="text" placeholder="gpt-4.1-mini" autocomplete="off">
          </label>
        </div>

        <div class="grid">
          <label class="field">
            <span>目标语言</span>
            <input id="targetLanguage" name="targetLanguage" type="text" placeholder="简体中文">
          </label>

          <label class="field">
            <span>Temperature</span>
            <input id="temperature" name="temperature" type="number" min="0" max="2" step="0.1">
          </label>
        </div>

        <div class="grid">
          <label class="field">
            <span>认证方式</span>
            <select id="authType" name="authType">
              <option value="bearer">Authorization: Bearer</option>
              <option value="x-api-key">x-api-key</option>
              <option value="custom">自定义 Header</option>
              <option value="none">无</option>
            </select>
          </label>

          <label class="field">
            <span>自定义认证 Header</span>
            <input id="customAuthHeader" name="customAuthHeader" type="text" placeholder="api-key">
          </label>
        </div>

        <label class="field">
          <span>系统提示词</span>
          <textarea id="systemPrompt" name="systemPrompt" rows="6"></textarea>
        </label>

        <label class="toggle">
          <input id="showSentenceSource" name="showSentenceSource" type="checkbox">
          <span>翻译句子时显示原文</span>
        </label>

        <label class="toggle">
          <input id="autoOpenPdfReader" name="autoOpenPdfReader" type="checkbox">
          <span>打开以 .pdf 结尾的链接时自动进入插件 PDF 文本阅读器</span>
        </label>

        <div class="actions">
          <button class="primary" type="submit">保存设置</button>
          <button class="secondary" id="test-button" type="button">测试翻译</button>
          <span id="status" class="status" role="status"></span>
        </div>
      </form>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
